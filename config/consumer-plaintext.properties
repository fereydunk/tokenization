# Consumer config for the "WITHOUT tokenization" baseline (plaintext topic).
#
# No rule.executors, no vault key — there's nothing to detokenize. EVERY reader
# of this topic sees the real ssn / credit_card_number, regardless of vault
# access. That's the whole point of the contrast: without tokenization there is
# no field-level protection at all.
#
# group.id is intentionally omitted so --group is the sole source (a fresh group
# each run guarantees --from-beginning replays).

bootstrap.servers=${BOOTSTRAP_SERVERS}
security.protocol=SASL_SSL
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_API_KEY}" password="${KAFKA_API_SECRET}";

schema.registry.url=${SR_URL}
basic.auth.credentials.source=USER_INFO
basic.auth.user.info=${SR_API_KEY}:${SR_API_SECRET}
use.latest.version=true

auto.offset.reset=earliest
