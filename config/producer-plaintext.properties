# Producer config for the "WITHOUT tokenization" baseline.
#
# Writes to the plaintext topic, whose schema has NO ruleSet — so nothing is
# tokenized and the raw ssn / credit_card_number land on the broker in the clear.
# This is the contrast case: it shows what Kafka holds when a team has NOT
# adopted CSFLT. No rule.executors, no vault — just a plain JSON-schema producer.

bootstrap.servers=${BOOTSTRAP_SERVERS}
security.protocol=SASL_SSL
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_API_KEY}" password="${KAFKA_API_SECRET}";

schema.registry.url=${SR_URL}
basic.auth.credentials.source=USER_INFO
basic.auth.user.info=${SR_API_KEY}:${SR_API_SECRET}
use.latest.version=true
auto.register.schemas=false
