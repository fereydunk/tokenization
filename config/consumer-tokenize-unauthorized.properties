# UNAUTHORIZED consumer config for the CP console JSON-schema consumer.
#
# Launched with VAULT_API_KEY=${VAULT_UNAUTHORIZED_KEY} (can_detokenize=false),
# so the executor's READ-path detokenize calls get 403 from the vault. The rule's
# onFailure=NONE (on read) then leaves the value in place — this consumer sees
# the opaque integer TOKENS, never the real ssn / credit_card_number.
#
# Everything else is identical to the authorized consumer: same schema, same
# rule, same cluster. The ONLY difference is the vault key in VAULT_API_KEY —
# exactly mirroring the CSFLE demo's with-KEK vs no-KEK consumer boundary.

bootstrap.servers=${BOOTSTRAP_SERVERS}
security.protocol=SASL_SSL
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_API_KEY}" password="${KAFKA_API_SECRET}";

schema.registry.url=${SR_URL}
basic.auth.credentials.source=USER_INFO
basic.auth.user.info=${SR_API_KEY}:${SR_API_SECRET}
use.latest.version=true

auto.offset.reset=earliest

rule.executors=_default_
rule.executors._default_.class=io.confluent.csflt.FieldTokenizationExecutor
