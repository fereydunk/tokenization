# Producer config for the CP console JSON-schema producer.
# envsubst-templated; values come from .env.
#
# The TOKENIZE rule itself lives in the schema's ruleSet (Schema Registry), not
# here — this file only turns on the generic rule-executor framework and points
# the "_default_" executor at our tokenization class. Identical in shape to the
# CSFLE demo's producer config; only the executor class differs.
#
# The vault API key is NOT a property: our executor reads VAULT_API_KEY from the
# environment (set to VAULT_AUTHORIZED_KEY when launching the producer), the same
# way CSFLE resolves KMS credentials from the environment rather than the schema.

bootstrap.servers=${BOOTSTRAP_SERVERS}
security.protocol=SASL_SSL
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_API_KEY}" password="${KAFKA_API_SECRET}";

schema.registry.url=${SR_URL}
basic.auth.credentials.source=USER_INFO
basic.auth.user.info=${SR_API_KEY}:${SR_API_SECRET}
use.latest.version=true
auto.register.schemas=false

rule.executors=_default_
rule.executors._default_.class=io.confluent.csflt.FieldTokenizationExecutor
